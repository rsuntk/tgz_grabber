name: Grab and Upload to Pixeldrain
on:
  workflow_dispatch:
jobs:
  grab_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload to PixelDrain
        run: |
          git config --global user.name "nobody"
          git config --global user.email "nobody@noreply.net"
          wget https://github.com/jkawamoto/go-pixeldrain/releases/download/v0.8.0/pd_0.8.0_linux_amd64.tar.gz; tar -xvf *.tar.gz; chmod +x ./pd
          git clone --single-branch -b android15-6.6-lts https://github.com/rsuplaygrnd/android_kernel_samsung_a06.git a06
          cd a06
          # Add ACK
          git remote add ACK https://android.googlesource.com/kernel/common.git; git fetch ACK android15-6.6-lts
          cd ..
          tar -czvf a06.tar.gz ./a06
          export PIXELDRAIN_API_KEY=${{ secrets.PD_TOKEN }}
          ./pd upload a06.tar.gz
